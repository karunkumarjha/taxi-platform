version: 2

sources:
  - name: raw
    description: >
      Landing schema for TLC Yellow Taxi parquet files, loaded via
      `COPY INTO` from the external S3 stage (see ingestion/load_snowflake.py).
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
    schema: "{{ env_var('SNOWFLAKE_RAW_SCHEMA', 'RAW') }}"

    # Freshness is relaxed to match TLC's publishing cadence (monthly, ~2-month lag).
    # warn at 45 days of no new loads; error at 75 days. A production feed would tune
    # these tighter against the actual SLA.
    loaded_at_field: _loaded_at
    freshness:
      warn_after: { count: 45, period: day }
      error_after: { count: 75, period: day }

    tables:
      - name: yellow_tripdata
        description: "Raw TLC Yellow Taxi trip records. One row per trip."
        columns:
          - name: vendorid
            description: "TPEP vendor code. 1 = Creative Mobile, 2 = VeriFone."
          - name: tpep_pickup_datetime
            description: "Pickup timestamp (local time, naive)."
          - name: tpep_dropoff_datetime
            description: "Dropoff timestamp."
          - name: passenger_count
            description: "Driver-entered; frequently 0 or NULL."
          - name: trip_distance
            description: "Meter-recorded distance in miles."
          - name: pulocationid
            description: "TLC zone for pickup. FK to taxi_zones.LocationID."
          - name: dolocationid
            description: "TLC zone for dropoff. FK to taxi_zones.LocationID."
          - name: fare_amount
            description: "Metered fare (excl. tips/tolls/surcharges)."
          - name: tip_amount
            description: "Driver-reported tip. Credit-card only — cash tips are not recorded."
          - name: total_amount
            description: "Total charged to the rider."
          - name: payment_type
            description: "1=credit, 2=cash, 3=no charge, 4=dispute, 5=unknown, 6=voided."
          - name: _source_filename
            description: "S3 filename the row came from (COPY INTO metadata)."
          - name: _loaded_at
            description: "Pipeline load timestamp (defaulted at COPY)."
