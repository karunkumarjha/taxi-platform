version: 2

sources:
  - name: raw
    description: >
      Landing schema for TLC Yellow Taxi parquet files, loaded via
      `COPY INTO` from the external S3 stage (see ingestion/load_snowflake.py).
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
    schema: "{{ env_var('SNOWFLAKE_RAW_SCHEMA', 'RAW') }}"

    # Freshness is relaxed to match TLC's publishing cadence (monthly, ~2-month lag).
    # warn at 45 days of no new loads; error at 75 days. A production feed would tune
    # these tighter against the actual SLA.
    loaded_at_field: _loaded_at
    freshness:
      warn_after: { count: 45, period: day }
      error_after: { count: 75, period: day }

    tables:
      - name: yellow_tripdata
        description: "Raw TLC Yellow Taxi trip records. One row per trip."
        columns:
          - name: vendorid
            description: "TPEP vendor code. 1 = Creative Mobile, 2 = VeriFone."
          - name: tpep_pickup_datetime
            description: "Pickup timestamp (local time, naive)."
          - name: tpep_dropoff_datetime
            description: "Dropoff timestamp."
          - name: passenger_count
            description: "Driver-entered; frequently 0 or NULL."
          - name: trip_distance
            description: "Meter-recorded distance in miles."
          - name: pulocationid
            description: "TLC zone for pickup. FK to dim_zones.location_id."
          - name: dolocationid
            description: "TLC zone for dropoff. FK to dim_zones.location_id."
          - name: fare_amount
            description: "Metered fare (excl. tips/tolls/surcharges)."
          - name: tip_amount
            description: "Driver-reported tip. Credit-card only — cash tips are not recorded."
          - name: total_amount
            description: "Total charged to the rider."
          - name: payment_type
            description: "1=credit, 2=cash, 3=no charge, 4=dispute, 5=unknown, 6=voided."
          - name: _source_filename
            description: "S3 filename the row came from (COPY INTO metadata)."
          - name: _ingest_batch_id
            description: "UUID4 per COPY call. Distinguishes load events when the same parquet is re-loaded (FORCE=TRUE)."
          - name: _loaded_by
            description: "Caller name (dbt_pipeline, manual). Lets analysts attribute each row to its load source."
          - name: _loaded_at
            description: "Pipeline load timestamp (defaulted at COPY)."

      - name: source_fingerprints
        description: >
          Per-file ETag fingerprints for TLC source parquet files. Populated
          by the Airflow detect_source_drift task on every run; updated by
          record_fingerprint after a successful build. Drives drift detection
          for retroactive TLC corrections (republished files) — see README
          architecture section.
        columns:
          - name: filename
            description: "TLC parquet filename (e.g. yellow_tripdata_2023-03.parquet)."
            tests: [not_null, unique]
          - name: etag
            description: "ETag from CloudFront HEAD (forwarded from S3 origin)."
            tests: [not_null]
          - name: last_modified
            description: "Last-Modified header from CloudFront HEAD."
          - name: content_length
            description: "Content-Length header from CloudFront HEAD."
          - name: recorded_at
            description: "Pipeline timestamp when this fingerprint was last recorded."

  - name: historical
    description: >
      Iceberg tables written by `spark/process_historical.py` on EMR
      Serverless and registered in AWS Glue. Snowflake reads zero-copy via
      CATALOG INTEGRATION. One Spark application produces all three tables
      from a single source read; each `spark_historical` DAG run replaces
      one year's partitions atomically.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
    schema: HISTORICAL
    tables:
      - name: daily_agg
        description: "Daily-grain aggregate by (date, hour, zone, payment_type). Serves Q1, Q2."
      - name: supply_gaps
        description: "Daily-grain supply-gap metrics by (date, zone). Serves Q3."
      - name: tip_behaviour
        description: "Daily-grain tip metrics by (date, zone, distance_bucket, payment_type). Serves Q4."
