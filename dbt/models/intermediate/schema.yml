version: 2

models:
  # The intermediate layer materialises atomic facts that aggregate marts
  # build on. Snowflake table names are kept as FCT_TRIPS / FCT_TRIPS_QUARANTINED
  # via dbt's +alias config so analysts and dashboards see stable canonical
  # names in the consumer-facing MARTS schema.

  - name: int_trips_enriched
    description: >
      Atomic trip-grain fact (Snowflake table: FCT_TRIPS). One row per VALID
      taxi trip, zone-joined. All 19 source columns from RAW.YELLOW_TRIPDATA
      are preserved (cast + renamed only) plus 7 derived columns + 6
      zone-enrichment columns + 2 load-metadata columns = 35 total (includes
      trip_bk). Source-of-truth that all aggregate marts (agg_*) build on.
      Clustered on (pickup_date, pu_location_id) — the two hottest predicates.
      Merged on trip_bk so TLC corrections propagate to the current row.
    columns:
      - name: trip_bk
        description: >
          Business key surrogate — md5 of the 5 immutable trip identifiers.
          Unique key for incremental merge; survives TLC corrections.
        data_type: VARCHAR
        tests:
          - not_null
          - unique
      - name: pu_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: location_id
      - name: do_location_id
        tests:
          - not_null
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23
      - name: pickup_dow
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 7
      - name: trip_duration_min
        tests:
          - trip_duration_sane:
              max_minutes: 720
      - name: payment_type
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
              config:
                severity: warn
      - name: ratecode_id
        description: "1=standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=negotiated, 6=group ride."
      - name: store_and_fwd_flag
        description: "Y = record stored in vehicle memory before forwarding (no live connection); N = transmitted live."
      - name: airport_fee
        description: "$1.25 fee for pickups at JFK / LaGuardia. Zero elsewhere."
      - name: congestion_surcharge
        description: "$2.50 NYC congestion fee for trips entering/within Manhattan below 96th St."

  - name: int_trips_quarantined
    description: >
      Audit fact (Snowflake table: FCT_TRIPS_QUARANTINED). Rows that failed
      staging validity rules, with the reason. Same column set as FCT_TRIPS
      plus quarantine_key and invalid_reason — investigators see full context
      for any quarantined row. Persisted as a table so dirty-record analysis
      doesn't re-scan RAW. Volume is <1% of total trips.
    columns:
      - name: quarantine_key
        description: >
          Deduplication surrogate (md5 of natural columns with null sentinel).
          Used as unique_key for delete+insert so reruns are idempotent even
          when natural key columns are NULL (e.g. null_timestamp rows).
          Not intended as a business identifier.
        data_type: VARCHAR
        tests:
          - not_null
          - unique
      - name: invalid_reason
        tests:
          - not_null
          - accepted_values:
              values:
                - null_timestamp
                - pickup_ge_dropoff
                - duration_out_of_range
                - non_positive_distance
                - distance_out_of_range
                - negative_fare_or_total
                - excessive_fare_or_total
                - tip_exceeds_fare_or_total
                - unknown_payment_type
                - null_location_id
                - duplicate_row
