version: 2

models:
  # The intermediate layer materialises atomic facts that aggregate marts
  # build on. Snowflake table names are kept as FCT_TRIPS / FCT_TRIPS_QUARANTINED
  # via dbt's +alias config so analysts and dashboards see stable canonical
  # names in the consumer-facing MARTS schema.

  - name: int_trips_enriched
    description: >
      Atomic trip-grain fact (Snowflake table: FCT_TRIPS). One row per VALID
      taxi trip, zone-joined. All 19 source columns from RAW.YELLOW_TRIPDATA
      are preserved (cast + renamed only) plus 7 derived columns + 6
      zone-enrichment columns + 1 surrogate key + 2 load-metadata columns =
      35 total. Source-of-truth that all aggregate marts (agg_*) build on.
      Clustered on (pickup_date, pu_location_id) — the two hottest predicates.
    columns:
      - name: trip_sk
        description: >
          Surrogate identifier (md5 hash of natural columns + source_filename).
          Convenient single-column join key but NOT the dedup key — Spark and
          dbt compute trip_sk independently, and engine-specific cast-to-string
          formatting produces different hashes for the same physical trip. The
          model's unique_key uses the natural-key tuple instead.
        data_type: VARCHAR
        tests:
          - not_null
          - unique  # within a single engine's output, trip_sk IS unique
      - name: pu_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: location_id
      - name: do_location_id
        tests:
          - not_null
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23
      - name: pickup_dow
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 7
      - name: trip_duration_min
        tests:
          - trip_duration_sane:
              max_minutes: 720
      - name: payment_type
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
              config:
                severity: warn
      - name: ratecode_id
        description: "1=standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=negotiated, 6=group ride."
      - name: store_and_fwd_flag
        description: "Y = record stored in vehicle memory before forwarding (no live connection); N = transmitted live."
      - name: airport_fee
        description: "$1.25 fee for pickups at JFK / LaGuardia. Zero elsewhere."
      - name: congestion_surcharge
        description: "$2.50 NYC congestion fee for trips entering/within Manhattan below 96th St."
    tests:
      # Natural-key uniqueness — the actual dedup mechanism. The 8 columns
      # uniquely identify a real trip (and match dup_rank's partition spec
      # in stg_yellow_trips so rule and key stay in sync).
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - vendor_id
            - pickup_ts
            - dropoff_ts
            - pu_location_id
            - do_location_id
            - fare_amount
            - total_amount
            - payment_type

  - name: int_trips_quarantined
    description: >
      Audit fact (Snowflake table: FCT_TRIPS_QUARANTINED). Rows that failed
      staging validity rules, with the reason. Same column set as FCT_TRIPS
      plus invalid_reason — investigators see full context for any
      quarantined row. Persisted as a table so dirty-record analysis
      doesn't re-scan RAW. Volume is <1% of total trips.
    columns:
      - name: invalid_reason
        tests:
          - not_null
          - accepted_values:
              values:
                - null_timestamp
                - pickup_ge_dropoff
                - duration_out_of_range
                - non_positive_distance
                - distance_out_of_range
                - negative_fare_or_total
                - excessive_fare_or_total
                - tip_exceeds_fare_or_total
                - unknown_payment_type
                - null_location_id
                - duplicate_row
