name: analytics
version: 1.0.0
config-version: 2

profile: analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

# Three logical dbt layers, all materialised in MARTS_BUILD (atomically
# swapped to MARTS on successful build):
#   staging       → views        (read snp_yellow_trips WHERE dbt_valid_to
#                                  IS NULL; cast + flag invalid rows)
#   intermediate  → incremental  (FCT_TRIPS — merge on trip_bk;
#                                  FCT_TRIPS_QUARANTINED — merge on
#                                  quarantine_key)
#   marts         → incremental  (AGG_*; delete+insert at the natural
#                                  grain of each aggregate)
#
# Plus a Silver SCD layer outside MARTS_BUILD:
#   snapshots/    → SCD Type 2   (snp_yellow_trips lives in SNAPSHOTS
#                                  schema, untouched by the blue-green
#                                  swap; tracks TLC corrections via
#                                  strategy='check' on mutable columns)
#
# Per-run scoping: `target_year` / `target_month` dbt vars (set by Airflow
# from logical_date − lag_months) gate the intermediate layer's incremental
# WHERE filter. One DAG run = one month; re-runs are idempotent (merge
# upserts existing trip_bks).
models:
  analytics:
    staging:
      +materialized: view
      +schema: marts_build
    intermediate:
      +schema: marts_build
    marts:
      # Blue-green: dbt writes marts into MARTS_BUILD. After all mart tests
      # pass, the swap_marts macro atomically flips MARTS_BUILD ↔ MARTS so
      # dashboards (which read MARTS) see the new build instantly. If any
      # mart test fails, the swap never runs and MARTS keeps the previous
      # good build. See dbt/macros/swap_marts.sql.
      +schema: marts_build

seeds:
  analytics:
    dim_zones:
      +schema: marts_build
      +column_types:
        location_id: INTEGER
        borough: STRING
        zone_name: STRING
        service_zone: STRING

vars:
  # Row-count sanity bounds for the singular test (±40% month-over-month, per the plan).
  monthly_rowcount_tolerance: 0.40
  # Minimum monthly volume before the M-over-M comparison runs. Avoids false
  # positives from partial-month tails (e.g. a single Feb row in the Jan file).
  monthly_rowcount_min: 10000
  # target_year / target_month are passed per Airflow run from the DAG;
  # they're consumed by intermediate + monthly marts (single-month scope)
  # and yearly marts (target_year only). No project-level default — a
  # missing var should fail loud in CI rather than silently full-refresh.
